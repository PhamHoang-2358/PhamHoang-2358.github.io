<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Công Cụ - Dụng Cụ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-bar-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="system-title">
                <i class="fas fa-tools"></i>
                <span class="system-title-text">HỆ THỐNG QUẢN LÝ CÔNG CỤ - DỤNG CỤ</span>
                <span class="system-title-short">QLCC</span>
            </div>
            
            <div class="global-search">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearch" placeholder="Tìm kiếm...">
            </div>

            <div class="quick-filters">
                <select class="filter-select" id="filterStatus">
                    <option value="">Tất cả hiện trạng</option>
                    <option value="Đang sử dụng">Đang sử dụng</option>
                    <option value="Nhàn rỗi">Nhàn rỗi</option>
                    <option value="Hỏng">Hỏng</option>
                    <option value="Không sử dụng">Không sử dụng</option>
                </select>

                <select class="filter-select" id="filterDemand">
                    <option value="">Nhu cầu sử dụng</option>
                    <option value="Thường xuyên">Thường xuyên</option>
                    <option value="Theo đợt">Theo đợt</option>
                    <option value="Cần bổ sung">Cần bổ sung</option>
                </select>

                <select class="filter-select" id="filterYear">
                    <option value="">Năm sử dụng</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="older">Trước 2021</option>
                </select>
            </div>
        </div>

        <div class="top-bar-right">
            <button class="mobile-search-btn" id="mobileSearchBtn">
                <i class="fas fa-search"></i>
            </button>
            
            <div class="notification-icon">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">3</span>
            </div>
            
            <div class="user-info">
                <span id="currentUsername" class="username-text"></span>
                <div class="user-avatar" id="userMenu">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            
            <div class="user-dropdown" id="userDropdown">
                <div class="dropdown-header">
                    <div class="dropdown-username" id="dropdownUsername"></div>
                    <div class="dropdown-role" id="dropdownRole"></div>
                </div>
                <button id="btnLogout" class="dropdown-logout">
                    <i class="fas fa-sign-out-alt"></i>
                    Đăng xuất
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Search Overlay -->
    <div class="mobile-search-overlay" id="mobileSearchOverlay">
        <div class="mobile-search-container">
            <button class="mobile-search-close" id="mobileSearchClose">
                <i class="fas fa-times"></i>
            </button>
            <div class="mobile-search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="mobileSearchInput" placeholder="Tìm kiếm...">
            </div>
        </div>
    </div>

    <!-- Mobile Filter Panel -->
    <div class="mobile-filter-panel" id="mobileFilterPanel">
        <div class="mobile-filter-header">
            <h3>Bộ lọc</h3>
            <button class="mobile-filter-close" id="mobileFilterClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="mobile-filter-body">
            <div class="mobile-filter-group">
                <label>Hiện trạng</label>
                <select class="filter-select" id="mobileFilterStatus">
                    <option value="">Tất cả hiện trạng</option>
                    <option value="Đang sử dụng">Đang sử dụng</option>
                    <option value="Nhàn rỗi">Nhàn rỗi</option>
                    <option value="Hỏng">Hỏng</option>
                    <option value="Không sử dụng">Không sử dụng</option>
                </select>
            </div>
            <div class="mobile-filter-group">
                <label>Nhu cầu sử dụng</label>
                <select class="filter-select" id="mobileFilterDemand">
                    <option value="">Tất cả</option>
                    <option value="Thường xuyên">Thường xuyên</option>
                    <option value="Theo đợt">Theo đợt</option>
                    <option value="Cần bổ sung">Cần bổ sung</option>
                </select>
            </div>
            <div class="mobile-filter-group">
                <label>Năm sử dụng</label>
                <select class="filter-select" id="mobileFilterYear">
                    <option value="">Tất cả</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="older">Trước 2021</option>
                </select>
            </div>
            <div class="mobile-filter-actions">
                <button class="btn btn-outline" id="mobileFilterReset">Đặt lại</button>
                <button class="btn btn-primary" id="mobileFilterApply">Áp dụng</button>
            </div>
        </div>
    </div>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- MAIN CONTAINER -->
    <div class="main-container">
        <!-- KPI CARDS -->
        <div class="kpi-section" id="kpiSection">
            <!-- KPI cards will be rendered by JS -->
        </div>

        <!-- ACTION BAR -->
        <div class="action-bar">
            <div class="selected-count" id="selectedCount">Chưa chọn mục nào</div>
            <div class="action-buttons">
                <button class="btn btn-primary" id="btnAdd">
                    <i class="fas fa-plus"></i> <span class="btn-text">Thêm công cụ</span>
                </button>
                <button class="btn btn-secondary" id="btnEdit" disabled>
                    <i class="fas fa-edit"></i> <span class="btn-text">Sửa</span>
                </button>
                <button class="btn btn-danger" id="btnDelete" disabled>
                    <i class="fas fa-trash"></i> <span class="btn-text">Xóa</span>
                </button>
                <button class="btn btn-outline mobile-filter-trigger" id="mobileFilterTrigger">
                    <i class="fas fa-filter"></i> <span class="btn-text">Lọc</span>
                </button>
                <button class="btn btn-outline" id="btnExportExcel">
                    <i class="fas fa-file-excel"></i> <span class="btn-text">Xuất Excel</span>
                </button>
                <button class="btn btn-outline" id="btnExportPDF">
                    <i class="fas fa-file-pdf"></i> <span class="btn-text">Xuất PDF</span>
                </button>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-container">
            <div class="table-wrapper">
                <table id="equipmentTable">
                    <thead>
                        <tr>
                            <th class="checkbox-cell">
                                <input type="checkbox" id="selectAll">
                            </th>
                            <th class="sortable" data-column="id">STT <i class="fas fa-sort sort-icon"></i></th>
                            <th class="sortable" data-column="name">Tên công cụ dụng cụ <i class="fas fa-sort sort-icon"></i></th>
                            <th class="sortable" data-column="serial">Seri Number <i class="fas fa-sort sort-icon"></i></th>
                            <th class="sortable" data-column="quantity">Số lượng <i class="fas fa-sort sort-icon"></i></th>
                            <th>ĐVT</th>
                            <th class="sortable" data-column="yearManufacture">Năm SX <i class="fas fa-sort sort-icon"></i></th>
                            <th class="sortable" data-column="yearUse">Năm SD <i class="fas fa-sort sort-icon"></i></th>
                            <th>Nước SX</th>
                            <th>Hãng SX</th>
                            <th>Mã hiệu</th>
                            <th>Công suất / Năng suất</th>
                            <th>Hiện trạng</th>
                            <th>Nhu cầu SD</th>
                            <th>Ghi chú</th>
                            <th style="width: 120px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="table-footer">
                <div class="pagination-info">
                    Hiển thị <span id="showingStart">1</span>-<span id="showingEnd">50</span> trong tổng số <span id="totalRecords">0</span> bản ghi
                </div>
                <div class="pagination" id="pagination">
                    <!-- Pagination will be rendered by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- SLIDE-IN PANEL -->
    <div class="panel-overlay" id="panelOverlay"></div>
    <div class="slide-panel" id="slidePanel">
        <div class="panel-header">
            <h3 class="panel-title" id="panelTitle">Thêm công cụ dụng cụ mới</h3>
            <button class="panel-close" id="panelClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="panel-body">
            <form id="equipmentForm">
                <div class="form-group">
                    <label class="form-label required">Tên công cụ dụng cụ</label>
                    <input type="text" class="form-control" id="formName" name="name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label required">Seri Number</label>
                        <input type="text" class="form-control" id="formSerial" name="serial" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số lượng</label>
                        <input type="number" class="form-control" id="formQuantity" name="quantity" value="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">ĐVT</label>
                        <select class="form-control" id="formUnit" name="unit">
                            <option>Cái</option>
                            <option>Bộ</option>
                            <option>Chiếc</option>
                            <option>Máy</option>
                            <option>Cặp</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Năm sản xuất</label>
                        <input type="number" class="form-control" id="formYearManufacture" name="yearManufacture" min="1900" max="2025">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Năm sử dụng</label>
                        <input type="number" class="form-control" id="formYearUse" name="yearUse" min="1900" max="2025">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nước sản xuất</label>
                        <input type="text" class="form-control" id="formCountry" name="country">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Hãng sản xuất</label>
                        <input type="text" class="form-control" id="formBrand" name="brand">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mã hiệu</label>
                        <input type="text" class="form-control" id="formModel" name="model">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Công suất / Năng suất</label>
                    <input type="text" class="form-control" id="formCapacity" name="capacity">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Hiện trạng</label>
                        <select class="form-control" id="formStatus" name="status">
                            <option>Đang sử dụng</option>
                            <option>Nhàn rỗi</option>
                            <option>Hỏng</option>
                            <option>Không sử dụng</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nhu cầu sử dụng</label>
                        <select class="form-control" id="formDemand" name="demand">
                            <option>Thường xuyên</option>
                            <option>Theo đợt</option>
                            <option>Cần bổ sung</option>
                            <option>Dự phòng</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Ghi chú</label>
                    <textarea class="form-control" id="formNote" name="note"></textarea>
                </div>
            </form>
        </div>
        <div class="panel-footer">
            <button class="btn btn-secondary" id="btnCancel">Hủy</button>
            <button class="btn btn-primary" id="btnSave">
                <i class="fas fa-save"></i> Lưu
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Authentication check
        (function() {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            const username = sessionStorage.getItem('username');
            const role = sessionStorage.getItem('role');

            // Redirect to login if not authenticated
            if (!isLoggedIn || isLoggedIn !== 'true') {
               // window.location.href = 'login.html';
                //return;
            }

            // Display user info
            document.getElementById('currentUsername').textContent = username || 'User';
            document.getElementById('dropdownUsername').textContent = username || 'User';
            document.getElementById('dropdownRole').textContent = role === 'admin' ? 'Quản trị viên' : 'Người dùng';

            // User menu toggle
            const userMenu = document.getElementById('userMenu');
            const userDropdown = document.getElementById('userDropdown');

            userMenu.addEventListener('click', function(e) {
                e.stopPropagation();
                userDropdown.style.display = userDropdown.style.display === 'none' ? 'block' : 'none';
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!userMenu.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.style.display = 'none';
                }
            });

            // Logout handler
            const btnLogout = document.getElementById('btnLogout');
            btnLogout.addEventListener('click', function() {
                if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                    sessionStorage.clear();
                    window.location.href = 'login.html';
                }
            });

            btnLogout.addEventListener('mouseenter', function() {
                this.style.backgroundColor = '#fee';
            });
            btnLogout.addEventListener('mouseleave', function() {
                this.style.backgroundColor = 'white';
            });
        })();

        // Mobile-specific functionality
        (function() {
            // Mobile search overlay
            const mobileSearchBtn = document.getElementById('mobileSearchBtn');
            const mobileSearchOverlay = document.getElementById('mobileSearchOverlay');
            const mobileSearchClose = document.getElementById('mobileSearchClose');
            const mobileSearchInput = document.getElementById('mobileSearchInput');
            const globalSearch = document.getElementById('globalSearch');

            if (mobileSearchBtn) {
                mobileSearchBtn.addEventListener('click', function() {
                    mobileSearchOverlay.classList.add('active');
                    mobileSearchInput.focus();
                });
            }

            if (mobileSearchClose) {
                mobileSearchClose.addEventListener('click', function() {
                    mobileSearchOverlay.classList.remove('active');
                });
            }

            // Sync mobile search with desktop search
            if (mobileSearchInput && globalSearch) {
                mobileSearchInput.addEventListener('input', function(e) {
                    globalSearch.value = e.target.value;
                    globalSearch.dispatchEvent(new Event('input'));
                });
            }

            // Mobile filter panel
            const mobileFilterTrigger = document.getElementById('mobileFilterTrigger');
            const mobileFilterPanel = document.getElementById('mobileFilterPanel');
            const mobileFilterClose = document.getElementById('mobileFilterClose');
            const mobileOverlay = document.getElementById('mobileOverlay');
            const mobileFilterApply = document.getElementById('mobileFilterApply');
            const mobileFilterReset = document.getElementById('mobileFilterReset');

            if (mobileFilterTrigger) {
                mobileFilterTrigger.addEventListener('click', function() {
                    mobileFilterPanel.classList.add('active');
                    mobileOverlay.classList.add('active');
                    // Sync filters
                    document.getElementById('mobileFilterStatus').value = document.getElementById('filterStatus').value;
                    document.getElementById('mobileFilterDemand').value = document.getElementById('filterDemand').value;
                    document.getElementById('mobileFilterYear').value = document.getElementById('filterYear').value;
                });
            }

            function closeMobileFilter() {
                mobileFilterPanel.classList.remove('active');
                mobileOverlay.classList.remove('active');
            }

            if (mobileFilterClose) {
                mobileFilterClose.addEventListener('click', closeMobileFilter);
            }

            if (mobileOverlay) {
                mobileOverlay.addEventListener('click', closeMobileFilter);
            }

            if (mobileFilterApply) {
                mobileFilterApply.addEventListener('click', function() {
                    // Apply filters
                    document.getElementById('filterStatus').value = document.getElementById('mobileFilterStatus').value;
                    document.getElementById('filterDemand').value = document.getElementById('mobileFilterDemand').value;
                    document.getElementById('filterYear').value = document.getElementById('mobileFilterYear').value;
                    
                    // Trigger change events
                    document.getElementById('filterStatus').dispatchEvent(new Event('change'));
                    document.getElementById('filterDemand').dispatchEvent(new Event('change'));
                    document.getElementById('filterYear').dispatchEvent(new Event('change'));
                    
                    closeMobileFilter();
                });
            }

            if (mobileFilterReset) {
                mobileFilterReset.addEventListener('click', function() {
                    document.getElementById('mobileFilterStatus').value = '';
                    document.getElementById('mobileFilterDemand').value = '';
                    document.getElementById('mobileFilterYear').value = '';
                });
            }

            // Optimize table scrolling on mobile
            const tableWrapper = document.querySelector('.table-wrapper');
            if (tableWrapper && window.innerWidth <= 768) {
                tableWrapper.style.webkitOverflowScrolling = 'touch';
            }

            // Handle window resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    mobileSearchOverlay.classList.remove('active');
                    closeMobileFilter();
                }
            });
        })();
    </script>
</body>
</html>
